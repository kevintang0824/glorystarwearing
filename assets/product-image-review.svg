<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Product image pending verification</title>
  <desc id="desc">A Glory Star Wear catalogue placeholder used when downloaded product media cannot be matched safely.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ed"/>
      <stop offset="1" stop-color="#e9ded2"/>
    </linearGradient>
  </defs>
  <rect width="900" height="900" fill="url(#background)"/>
  <circle cx="450" cy="376" r="132" fill="none" stroke="#df8268" stroke-width="2"/>
  <path d="m450 281 24 68 72 2-57 44 20 69-59-40-59 40 20-69-57-44 72-2z" fill="#34483d"/>
  <text x="450" y="580" fill="#20231f" font-family="Georgia, serif" font-size="44" text-anchor="middle">Image under review</text>
  <text x="450" y="630" fill="#66665f" font-family="Arial, sans-serif" font-size="22" letter-spacing="3" text-anchor="middle">GLORY STAR WEAR</text>
</svg>
