name: Clean repository metadata
on: [push]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove macOS metadata
        run: |
          find . -type f -name '._*' -delete
          printf '.DS_Store\n._*\n' > .gitignore
          rm -f .github/workflows/cleanup-repository.yml
          git config user.name Codex
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove macOS metadata files"
          git push
